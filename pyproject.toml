[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opsagent"
version = "0.1.0"
description = "An ops agent with tool calling, its own MCP server, human approval gates, crash recovery and tracing."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["anthropic[mcp]>=1.11", "mcp>=2.3,<3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
opsagent = "opsagent.cli:main"

[tool.setuptools]
packages = ["opsagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
